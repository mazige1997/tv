name: Build TVBox Kotlin & Publish Release

on:
  # 推送 v* 标签时自动创建 GitHub Release 并上传 APK
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # 手动触发时也会创建 Release;可指定 tag,留空则用 v<run number>
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签(如 v2.0.0-kt.1),留空自动生成'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Rust 核心单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: 运行 tvbox-core 测试
        working-directory: rust
        run: cargo test -p tvbox-core --release --locked

  build-release:
    name: 编译并发布 Release APK
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不用 android-actions/setup-android@v3:它会安装已废弃的 tools 包,
      # 在较新的 cmdline-tools 上报 "Failed to find package 'tools'" 而失败。
      # ubuntu-latest 镜像已自带 Android SDK,这里直接定位 sdkmanager 并安装所需版本。
      - name: 配置 Android SDK / NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager,请检查 runner 的 Android SDK 环境"
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" > /dev/null

      - name: 安装 Rust 及 Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 缓存 Cargo 交叉编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust-target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Rust 核心并打包 Release APK
        run: ./gradlew assembleTvRelease --no-daemon --stacktrace

      # ABI splits 产出三个 APK:32 位(armeabi-v7a)、64 位(arm64-v8a)、通用(universal)。
      # 逐包列出 native 库并硬校验:缺包或缺 so 直接让 CI 失败,不放行有缺陷的产物。
      - name: 校验三个 APK 的 ABI 与 native 库
        run: |
          APK_DIR=app/build/outputs/apk/tv/release
          echo "--- 产物清单 ---"
          ls -lh "$APK_DIR"/*.apk

          COUNT=$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | wc -l)
          echo "APK 数量: $COUNT (期望 3: 32位 / 64位 / 通用)"
          if [ "$COUNT" -ne 3 ]; then
            echo "::error::期望 3 个 APK,实得 $COUNT 个 —— ABI splits 可能未生效"
            exit 1
          fi

          APK32=$(find "$APK_DIR" -maxdepth 1 -name '*armeabi-v7a*.apk' | head -n 1)
          APK64=$(find "$APK_DIR" -maxdepth 1 -name '*arm64-v8a*.apk' | head -n 1)
          APKALL=$(find "$APK_DIR" -maxdepth 1 -name '*universal*.apk' | head -n 1)
          for item in "32位|$APK32" "64位|$APK64" "通用|$APKALL"; do
            label="${item%%|*}"; path="${item#*|}"
            if [ -z "$path" ]; then echo "::error::缺少 $label 包"; exit 1; fi
          done

          echo "--- 各包 native 库清单 ---"
          for apk in "$APK_DIR"/*.apk; do
            echo "### $(basename "$apk")"
            unzip -l "$apk" | grep -E "lib/[^/]+/.*\.so" | awk '{print $4}' | sort || true
          done

          # 用 case 做子串匹配,避免 grep -q 提前退出触发 pipefail 下的 SIGPIPE 误报。
          check_so() {
            local apk="$1" abi="$2" lib="$3"
            local listing
            listing=$(unzip -l "$apk")
            case "$listing" in
              *"lib/$abi/$lib"*)
                echo "OK  $(basename "$apk") -> $abi/$lib" ;;
              *)
                echo "::error::$(basename "$apk") 缺少 $abi/$lib"
                exit 1 ;;
            esac
          }

          echo "--- 严格校验 ---"
          check_so "$APK32"  armeabi-v7a libtvbox_core.so
          check_so "$APK32"  armeabi-v7a libplayer.so
          check_so "$APK64"  arm64-v8a  libtvbox_core.so
          check_so "$APK64"  arm64-v8a  libplayer.so
          check_so "$APKALL" armeabi-v7a libtvbox_core.so
          check_so "$APKALL" arm64-v8a  libtvbox_core.so
          check_so "$APKALL" x86_64     libtvbox_core.so
          echo "三个 APK 的 native 库校验全部通过"

      - name: 解析 Release 标签
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-kt-release
          path: |
            app/build/outputs/apk/tv/release/*.apk
            app/build/outputs/mapping/tvRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: 创建/更新 GitHub Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TVBox Kotlin ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/tv/release/*.apk
            app/build/outputs/mapping/tvRelease/mapping.txt
