name: Build TVBox Kotlin & Publish Release

on:
  # 推送 v* 标签时自动创建 GitHub Release 并上传 APK
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # 手动触发时也会创建 Release;可指定 tag,留空则用 v<run number>
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签(如 v2.0.0-kt.1),留空自动生成'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Rust 核心单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: 运行 tvbox-core 测试
        working-directory: rust
        run: cargo test -p tvbox-core --release --locked

  build-release:
    name: 编译并发布 Release APK
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK / Platform / Build-Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;25.2.9519653" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null

      - name: 安装 Rust 及 Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 缓存 Cargo 交叉编译产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust-target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Rust 核心并打包 Release APK
        run: ./gradlew assembleTvRelease --no-daemon --stacktrace

      - name: 解析 Release 标签
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-kt-release
          path: |
            app/build/outputs/apk/tv/release/*.apk
            app/build/outputs/mapping/tvRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: 创建 GitHub Release 并上传 APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TVBox Kotlin ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/tv/release/*.apk
            app/build/outputs/mapping/tvRelease/mapping.txt
